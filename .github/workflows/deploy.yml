# CI/CD Pipeline for Malik Group

name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/Malik_Group

            # Fix git ownership issue
            git config --global --add safe.directory /var/www/Malik_Group

            # Force update to match GitHub
            git fetch origin
            git reset --hard origin/main

            # Install Composer dependencies
            /usr/bin/php8.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # Install NPM dependencies and build Vite assets
            npm ci
            npm run build

            # Run Laravel optimizations
            /usr/bin/php8.4 artisan config:clear
            /usr/bin/php8.4 artisan route:cache
            /usr/bin/php8.4 artisan view:cache

            # Run migrations
            /usr/bin/php8.4 artisan migrate --force

            # Ensure storage link
            /usr/bin/php8.4 artisan storage:link || true

            # Clear application cache
            /usr/bin/php8.4 artisan cache:clear

            # Fix permissions
            chown -R www-data:www-data .
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

            # Restart services
            systemctl reload php8.4-fpm
            systemctl reload nginx

            echo "Deployment completed successfully!"
